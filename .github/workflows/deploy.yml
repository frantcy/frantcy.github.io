name: 构建并部署博客

# 触发时机：
#   1. 往 main 分支推送内容（包括手机端 compose 页面写入的 .md）
#   2. 手动在 GitHub 网页上点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 构建站点到 Rendered/
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
          TZ: Asia/Shanghai
        run: python -m OpenBlogger.cli build --force

      - name: 生成 .nojekyll
        run: touch Rendered/.nojekyll

      - name: 推送到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd Rendered
          rm -rf .git
          git init -q
          git config core.autocrlf false
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git symbolic-ref HEAD refs/heads/gh-pages
          git add -A
          git commit -q -m "deploy: ${{ github.event.head_commit.message || '手动触发构建' }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
          echo "已部署到 gh-pages"
